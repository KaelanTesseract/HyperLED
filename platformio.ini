[platformio]
default_envs = esp32-s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
; Patches a vendored NeoPixelBus header that fails to compile on ESP-IDF 5.5+
; (upstream fix not released yet, see comment in the script). Safe no-op elsewhere.
extra_scripts = pre:patch_neopixelbus.py

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    mathieucarbou/AsyncTCP @ ^3.2.5
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
    makuna/NeoPixelBus @ ^2.8.0
    knolleary/PubSubClient @ ^2.8
    esphome/esp-hub75 @ ^0.3.0

build_flags =
    -I include

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1
platform = https://github.com/pioarduino/platform-espressif32.git
; Waveshare ESP32-S3-Zero: ESP32-S3FH4R2, embedded 4MB Quad flash + 2MB Octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -fno-exceptions
    -fno-rtti
    -D HUB75_BIT_DEPTH=6
